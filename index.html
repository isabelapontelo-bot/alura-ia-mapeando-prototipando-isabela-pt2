<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minha Jornada & Rotina</title>
  <link rel="stylesheet" href="style.css">
  <style>
:root {
  --bg-dark: #07070d;
  --color-1: #00f2fe;
  --color-2: #9b51e0;
  --color-3: #ff2a85;
  --gradient-3d: linear-gradient(135deg, var(--color-1), var(--color-2), var(--color-3));
  --glass-surface: rgba(255, 255, 255, 0.04);
  --glass-border: rgba(255, 255, 255, 0.1);
  --text-primary: #f8fafc;
  --text-muted: #94a3b8;
}

* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
}

body {
  background-color: var(--bg-dark);
  color: var(--text-primary);
  min-height: 100vh;
  overflow-x: hidden;
  perspective: 1200px;
  position: relative;
}

.bg-3d-scene {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
  z-index: 0;
  overflow: hidden;
}

.shape3d {
  position: absolute;
  transform-style: preserve-3d;
  filter: drop-shadow(0 15px 30px rgba(0,0,0,0.7));
  animation: float3d 14s infinite ease-in-out alternate;
}

.sphere {
  border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, var(--color-1), var(--color-2));
  box-shadow: inset -10px -10px 20px rgba(0,0,0,0.8), 0 0 30px rgba(0, 242, 254, 0.3);
}

.sphere-1 {
  width: 140px;
  height: 140px;
  top: 8%;
  left: 6%;
  animation-duration: 10s;
}

.sphere-2 {
  width: 90px;
  height: 90px;
  bottom: 12%;
  right: 8%;
  background: radial-gradient(circle at 35% 35%, var(--color-3), var(--color-2));
  animation-duration: 16s;
  animation-delay: -4s;
}

.torus {
  border: 18px solid transparent;
  border-radius: 50%;
  border-top-color: var(--color-3);
  border-right-color: var(--color-2);
  border-bottom-color: var(--color-1);
  box-shadow: 0 0 25px rgba(255, 42, 133, 0.3);
}

.torus-1 {
  width: 160px;
  height: 160px;
  top: 15%;
  right: 12%;
  transform: rotateX(65deg) rotateY(25deg);
  animation: rotateTorus 18s infinite linear;
}

.torus-2 {
  width: 110px;
  height: 110px;
  bottom: 25%;
  left: 10%;
  transform: rotateX(45deg) rotateY(-35deg);
  animation: rotateTorus 22s infinite linear reverse;
}

.pyramid {
  width: 0;
  height: 0;
  border-left: 50px solid transparent;
  border-right: 50px solid transparent;
  border-bottom: 90px solid var(--color-2);
  filter: drop-shadow(0 10px 20px rgba(155, 81, 224, 0.5));
  animation-duration: 12s;
  animation-delay: -2s;
}

.pyramid-1 {
  top: 55%;
  right: 22%;
}

.cube-1 {
  width: 70px;
  height: 70px;
  background: linear-gradient(135deg, var(--color-1), var(--color-3));
  border-radius: 16px;
  top: 40%;
  left: 20%;
  transform: rotateX(45deg) rotateY(45deg);
  animation: floatCube 15s infinite ease-in-out;
}

.app-container {
  position: relative;
  z-index: 1;
  max-width: 1100px;
  margin: 0 auto;
  padding: 50px 20px;
}

.header {
  text-align: center;
  margin-bottom: 45px;
}

.badge {
  display: inline-block;
  padding: 6px 16px;
  background: rgba(255, 255, 255, 0.08);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  font-size: 0.8rem;
  letter-spacing: 1px;
  text-transform: uppercase;
  color: var(--color-1);
  margin-bottom: 15px;
}

.gradient-title {
  font-size: 3.2rem;
  font-weight: 800;
  background: var(--gradient-3d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  letter-spacing: -1px;
  filter: drop-shadow(0 4px 12px rgba(155, 81, 224, 0.3));
}

.subtitle {
  color: var(--text-muted);
  font-size: 1.1rem;
  margin-top: 10px;
  margin-bottom: 30px;
}

.day-tabs {
  display: flex;
  justify-content: center;
  gap: 10px;
  flex-wrap: wrap;
}

.tab-btn {
  background: var(--glass-surface);
  border: 1px solid var(--glass-border);
  color: var(--text-muted);
  padding: 10px 20px;
  border-radius: 12px;
  cursor: pointer;
  font-size: 0.95rem;
  font-weight: 600;
  transition: all 0.3s ease;
  backdrop-filter: blur(10px);
  text-decoration: none;
  display: inline-block;
}

.tab-btn:hover {
  border-color: var(--color-1);
  color: var(--text-primary);
}

.tab-btn.active {
  background: var(--gradient-3d);
  color: #000;
  border-color: transparent;
  box-shadow: 0 8px 20px rgba(0, 242, 254, 0.3);
}

.cards-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
  gap: 25px;
}

.card-3d {
  background: var(--glass-surface);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 25px;
  cursor: pointer;
  transform-style: preserve-3d;
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275), box-shadow 0.4s ease, border-color 0.3s;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
  position: relative;
  overflow: hidden;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.card-3d:hover {
  transform: translateY(-12px) rotateX(6deg) rotateY(4deg) scale(1.02);
  border-color: rgba(255, 42, 133, 0.5);
  box-shadow: 0 25px 45px rgba(155, 81, 224, 0.25);
}

.card-icon {
  font-size: 2.2rem;
  margin-bottom: 12px;
}

.card-period {
  font-size: 0.75rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 1px;
  color: var(--color-1);
}

.card-title {
  font-size: 1.35rem;
  margin: 6px 0;
}

.card-time {
  font-size: 0.85rem;
  color: var(--color-3);
  font-weight: 600;
  margin-bottom: 12px;
}

.card-summary {
  font-size: 0.9rem;
  color: var(--text-muted);
  line-height: 1.4;
  margin-bottom: 20px;
}

.card-action {
  font-size: 0.85rem;
  font-weight: 700;
  color: var(--text-primary);
  display: flex;
  align-items: center;
  gap: 5px;
  transition: gap 0.2s;
  text-decoration: none;
}

.card-3d:hover .card-action {
  gap: 10px;
  color: var(--color-1);
}

.subpage-btn {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 14px;
  background: rgba(255, 255, 255, 0.06);
  border: 1px solid var(--glass-border);
  border-radius: 10px;
  color: var(--color-1);
  font-size: 0.82rem;
  font-weight: 700;
  text-decoration: none;
  text-align: center;
  transition: all 0.25s ease;
}

.subpage-btn:hover {
  background: var(--gradient-3d);
  color: #000;
  border-color: transparent;
}

.modal-overlay {
  position: fixed;
  top: 0;
  left: 0;
  width: 100vw;
  height: 100vh;
  background: rgba(4, 4, 8, 0.85);
  backdrop-filter: blur(12px);
  z-index: 100;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
}

.modal-overlay.active {
  opacity: 1;
  pointer-events: all;
}

.modal-card {
  background: #0d0e15;
  border: 1px solid var(--glass-border);
  border-radius: 28px;
  padding: 35px;
  width: 90%;
  max-width: 520px;
  position: relative;
  box-shadow: 0 30px 60px rgba(0, 0, 0, 0.9), 0 0 40px rgba(155, 81, 224, 0.2);
  transform: scale(0.8) translateZ(-100px);
  transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
}

.modal-overlay.active .modal-card {
  transform: scale(1) translateZ(0);
}

.close-btn {
  position: absolute;
  top: 20px;
  right: 25px;
  background: none;
  border: none;
  color: var(--text-muted);
  font-size: 2rem;
  cursor: pointer;
  transition: color 0.2s;
}

.close-btn:hover {
  color: var(--color-3);
}

.modal-period {
  background: var(--gradient-3d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  font-weight: 800;
  font-size: 0.85rem;
  text-transform: uppercase;
}

.modal-header h2 {
  font-size: 2rem;
  margin-top: 5px;
  margin-bottom: 15px;
}

.info-tag {
  background: rgba(255, 255, 255, 0.05);
  padding: 8px 14px;
  border-radius: 10px;
  font-size: 0.9rem;
  display: inline-block;
  margin-bottom: 15px;
  border: 1px solid var(--glass-border);
}

.modal-desc {
  color: var(--text-muted);
  line-height: 1.6;
  font-size: 0.95rem;
  margin-bottom: 20px;
}

.modal-body h3 {
  font-size: 1.1rem;
  color: var(--color-1);
  margin-bottom: 12px;
}

.steps-list {
  list-style: none;
  margin-bottom: 25px;
}

.steps-list li {
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 0.9rem;
  border-left: 3px solid var(--color-2);
}

.btn-close-modal {
  width: 100%;
  padding: 12px;
  background: var(--gradient-3d);
  border: none;
  border-radius: 14px;
  color: #000;
  font-weight: 700;
  font-size: 1rem;
  cursor: pointer;
  box-shadow: 0 10px 20px rgba(0, 242, 254, 0.25);
  transition: transform 0.2s, box-shadow 0.2s;
  display: inline-block;
  text-align: center;
  text-decoration: none;
}

.btn-close-modal:hover {
  transform: translateY(-2px);
  box-shadow: 0 14px 28px rgba(255, 42, 133, 0.35);
}

/* Estilos para as páginas secundárias com o mesmo visual */
.subpage-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 25px;
}

.panel-3d {
  background: var(--glass-surface);
  backdrop-filter: blur(14px);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 28px;
  box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
}

.panel-3d h2 {
  font-size: 1.35rem;
  color: var(--color-1);
  margin-bottom: 14px;
}

.check-row {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 10px 14px;
  background: rgba(255, 255, 255, 0.03);
  border-radius: 10px;
  margin-bottom: 8px;
  font-size: 0.9rem;
  border-left: 3px solid var(--color-2);
  cursor: pointer;
}

.check-row input {
  width: 17px;
  height: 17px;
  accent-color: var(--color-1);
}

.check-row.done span {
  text-decoration: line-through;
  color: var(--text-muted);
}

.timer-value {
  font-size: 3rem;
  font-weight: 800;
  text-align: center;
  background: var(--gradient-3d);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  margin: 18px 0;
}

.notes-box {
  width: 100%;
  min-height: 110px;
  background: rgba(255, 255, 255, 0.03);
  border: 1px solid var(--glass-border);
  border-radius: 12px;
  padding: 12px;
  color: var(--text-primary);
  font-size: 0.9rem;
  margin-top: 10px;
  resize: vertical;
}

.notes-box:focus {
  outline: none;
  border-color: var(--color-1);
}

@keyframes float3d {
  0% {
    transform: translateY(0) rotateX(0deg) rotateY(0deg);
  }
  100% {
    transform: translateY(-30px) rotateX(20deg) rotateY(15deg);
  }
}

@keyframes rotateTorus {
  0% {
    transform: rotateX(65deg) rotateY(25deg) rotateZ(0deg);
  }
  100% {
    transform: rotateX(65deg) rotateY(25deg) rotateZ(360deg);
  }
}

@keyframes floatCube {
  0%, 100% {
    transform: translateY(0) rotateX(45deg) rotateY(45deg);
  }
  50% {
    transform: translateY(-25px) rotateX(90deg) rotateY(90deg);
  }
}
  </style>
</head>

    let currentDay = 'segunda';

    function renderCards(day) {
      const grid = document.getElementById('cardsGrid');
      if (!grid) return;
      grid.innerHTML = '';
      
      const items = routineData[day] || [];
      
      items.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'card-3d';
        card.style.animationDelay = `${index * 0.1}s`;

        card.innerHTML = `
          <div onclick='openModal(${JSON.stringify(item)})'>
            <div class="card-icon">${item.icon}</div>
            <span class="card-period">${item.period}</span>
            <h3 class="card-title">${item.title}</h3>
            <p class="card-time">⏱️ ${item.time}</p>
            <p class="card-summary">${item.summary}</p>
            <div class="card-action">Ver detalhes ➔</div>
          </div>
          <a href="${item.page}" class="subpage-btn">Página dedicada ↗</a>
        `;
        
        grid.appendChild(card);
      });
    }

    function switchDay(day, evt) {
      currentDay = day;
      document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
      if (evt && evt.target) {
        evt.target.classList.add('active');
      }
      renderCards(day);
    }

    function openModal(item) {
      document.getElementById('mPeriod').innerText = item.period;
      document.getElementById('mTitle').innerText = item.title;
      document.getElementById('mTime').innerText = item.time;
      document.getElementById('mDescription').innerText = item.description;
      document.getElementById('mPageLink').href = item.page;

      const stepsList = document.getElementById('mSteps');
      stepsList.innerHTML = '';
      item.steps.forEach(step => {
        const li = document.createElement('li');
        li.innerText = step;
        stepsList.appendChild(li);
      });

      document.getElementById('routineModal').classList.add('active');
    }

    function closeModal() {
      document.getElementById('routineModal').classList.remove('active');
    }

    window.onclick = function(e) {
      const modal = document.getElementById('routineModal');
      if (e.target === modal) {
        closeModal();
      }
    };

    document.addEventListener('DOMContentLoaded', () => {
      renderCards(currentDay);
    });
  </script>
